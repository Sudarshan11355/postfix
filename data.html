<!DOCTYPE html>
<html>
<head>
  <title>User List</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; background-color: #f0f0f0; }
    h2 { color: #333; }
    ul { list-style-type: none; padding: 0; }
    li { background-color: #fff; margin: 10px; padding: 8px; border-radius: 4px; box-shadow: 0 0 5px rgba(0,0,0,0.1); width: 300px; margin: 10px auto; }
  </style>
</head>
<body>
  <h2>Registered Users</h2>
  <ul id="userList"></ul>

  <script>
    const users = JSON.parse(localStorage.getItem("users") || "[]");
    const list = document.getElementById("userList");

    users.forEach(user => {
      const li = document.createElement("li");
      li.textContent = `${user.name} - ${user.email}`;
      list.appendChild(li);
    });
  </script>
</body>
</html>
