<!DOCTYPE html>
<html>
<head>
  <title>User Registration</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; margin: 0; background-color: #f0f0f0; }
    h2 { color: #333; }
    form { display: inline-block; padding: 20px; background-color: #fff; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
    input { padding: 8px; margin: 10px; border-radius: 4px; border: 1px solid #ccc; width: 200px; }
    button { padding: 8px 20px; background-color: #4CAF50; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #45a049; }
  </style>
</head>
<body>
  <h2>User Registration</h2>
  <form id="registrationForm">
    <input type="text" id="name" placeholder="Name" required><br><br>
    <input type="email" id="email" placeholder="Email" required><br><br>
    <button type="submit">Register</button>
  </form>

  <script>
    document.getElementById("registrationForm").addEventListener("submit", function(e) {
      e.preventDefault();
      const userData = { name: document.getElementById("name").value, email: document.getElementById("email").value };
      let users = JSON.parse(localStorage.getItem("users") || "[]");
      users.push(userData);
      localStorage.setItem("users", JSON.stringify(users));

      const xhr = new XMLHttpRequest();
      xhr.open("POST", "https://jsonplaceholder.typicode.com/posts", true);
      xhr.setRequestHeader("Content-Type", "application/json;charset=UTF-8");
      xhr.send(JSON.stringify(userData));

      window.location.href = "data.html";
    });
  </script>
</body>
</html>
